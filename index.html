<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline so the page carries no external asset of any kind. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='6' r='4' fill='%232563EB'/%3E%3Ccircle cx='7' cy='24' r='4' fill='%23DC2626'/%3E%3Ccircle cx='25' cy='24' r='4' fill='%2315803D'/%3E%3Cpath d='M16 10 L7 20 M16 10 L25 20' stroke='%23A9B4C4' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Step through a real Language Agent Tree Search run, one operation at a time."
    />
    <title>LATS Trace Visualizer</title>
    <!--
      Restore a remembered dark mode before the first paint, so someone who
      chose it last visit is not shown a white page for a frame. The key and the
      page colour are the ones in src/theme.ts; the app takes over from here.
    -->
    <script>
      try {
        if (localStorage.getItem('lats-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
          document.documentElement.style.background = '#10141B'
        }
      } catch (e) {
        /* storage denied: the viewer opens in light, which is the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
